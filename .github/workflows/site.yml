name: Site

# Builds the site on every pull request (a build error fails the check) and
# publishes it to GitHub Pages from main, nightly and on demand (og-dev-hub#17).
# The build needs no secret: it reads public git alone.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Whole runs are ordered per ref and never cancelled: pushes to main queue behind
# a running deploy, and a pull request (its own ref) never shares main's group.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: pixi run site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          locked: true

      - name: Build the site
        run: pixi run site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # Only main publishes: a pull request, or a dispatch on another branch, builds only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
