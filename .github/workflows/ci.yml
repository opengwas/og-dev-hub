name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pixi test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs strictly from the committed pixi.lock; fails instead of
      # silently re-solving if pixi.toml and pixi.lock have drifted apart.
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          locked: true

      # The site's suite draws its diagrams with graphviz's `dot` and runs its view
      # scripts with `node`, both of which the environment has.
      - name: Run the suites
        run: pixi run test
