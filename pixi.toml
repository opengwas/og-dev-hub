[workspace]
name = "og-dev-hub"
description = "The Dev Hub: the static site that draws OpenGWAS's built state"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

# The sole user-facing execution interface is `pixi run <task>`, as in
# opengwasdb-stores, which the site came from (og-dev-hub#7).

[dependencies]
python = "3.12.*"
pyyaml = "*"
# The board collector calls `gh` (`site-data`, `architecture`; never the site);
# the read handles call `git`.
gh = "*"
git = "*"
# The site draws its diagrams to SVG at build time with `dot` (og-dev-hub#15).
graphviz = "*"

[pypi-dependencies]
# The site's own code, installed editable so it imports without sys.path
# insertions.
og-dev-hub = { path = ".", editable = true }
# opengwasdb-stores' Store Registry contract (`ogstores.bundle`) and the
# yardstick's result schema (`yardstick.result`, og-dev-hub#16), which the Stores
# collector reads the registry through. Its `dependencies` are empty,
# so this brings in no second copy of anything here. Every call passes the
# registry root it reads: an installed `ogstores` does not know where a
# registry checkout is.
ogstores = { git = "https://github.com/opengwas/opengwasdb-stores", rev = "5cab2625f33f2345a153cfb20c473a011935830d" }

[tasks]
# The suites: every tests/**/test_*.py, each run as a script, one at a time.
test = { cmd = "bash tests/run_all_tests.sh" }

# The collection `pixi run architecture --data` reads (#389, docs/spec/project-site.md):
# the board, the Stores, the architecture and the work, private repositories and
# the board included, one JSON file each. A source it cannot read is written as
# `available: false` and printed as UNAVAILABLE, with exit status 0 unless
# `--strict`. The site does not read it: `pixi run site` collects public git alone.
#
#   pixi run site-data [--data-dir PATH] [--registry PATH] [--refresh] [--strict]
site-data = { cmd = "python3 -m project_site.collect" }

# The architecture map's command line (#419): `check` and `conflicts`.
#
#   pixi run architecture conflicts --refresh --registry ~/repo/opengwasdb-stores --branch B
architecture = { cmd = "python3 -m project_site.architecture" }

# The site (og-dev-hub#15, docs/site.md): collect from public git alone (no token, no
# /data, no private repository, no board), then write the static page into `_site/`.
#
#   pixi run site [--out DIR] [--data-dir DIR] [--registry PATH] [--no-refresh]
#   pixi run site-preview [--port N]   # serve _site/ at http://localhost:4200/og-dev-hub/
site = { cmd = "python3 -m project_site.site" }
site-preview = { cmd = "python3 -m project_site.site serve" }
